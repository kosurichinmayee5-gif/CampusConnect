        render();
      };

      window.applyRescheduleUpdate = function () {
        if (!activeRescheduleModal) return;

        let infoPayload = { mode: rescheduleMode };
        if (rescheduleMode === "now") {
          infoPayload.newDay = document
            .getElementById("reschedNewDay")
            .value.trim();
          infoPayload.newTime = document
            .getElementById("reschedNewTime")
            .value.trim();
          infoPayload.newRoom = document
            .getElementById("reschedNewRoom")
            .value.trim();
        }

        if (activeRescheduleModal.type === "class") {
          const fac = authorizedFacultyDB.find(
            (f) => f.id === activeRescheduleModal.facId,
          );
          const slot =
            fac.schedules[activeRescheduleModal.sec][
              activeRescheduleModal.slotIdx
            ];
          slot.status = activeRescheduleModal.requestedStatus;
          slot.rescheduleInfo = infoPayload;
        } else if (activeRescheduleModal.type === "exam") {
          const exam = sectionExamsDB[activeRescheduleModal.sec].find(
            (e) => e.id === activeRescheduleModal.examId,
          );
          const sub = exam.subjects[activeRescheduleModal.subIdx];
          sub.status = "Rescheduled";
          sub.rescheduleInfo = infoPayload;
        }

        activeRescheduleModal = null;
        render();
      };

      window.handleSearch = function (val) {
        searchQuery = val;
        render();
        const input = document.getElementById("moduleSearchInput");
        if (input) {
          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      };

      window.saveFileOffline = function (filename, title, slides) {
        if (!offlineSavedFiles.find((f) => f.filename === filename)) {
          offlineSavedFiles.push({ filename, title, slides });
        }
        alert(`Saved "${filename}" to your Offline Library!`);
        render();
      };

      window.toggleOfflineModal = function (open) {
        isOfflineModalOpen = open;
        render();
      };

      window.openDocumentReader = function (filename, parentTitle, slides) {
        activeReaderData = {
          filename,
          parentTitle,
          slides,
          currentSlide: 0,
        };
        render();
      };

      window.closeDocumentReader = function () {
        activeReaderData = null;
        render();
      };

      window.nextSlide = function () {
        if (
          activeReaderData &&
          activeReaderData.currentSlide < activeReaderData.slides.length - 1
        ) {
          activeReaderData.currentSlide++;
          render();
        }
      };

      window.prevSlide = function () {
        if (activeReaderData && activeReaderData.currentSlide > 0) {
          activeReaderData.currentSlide--;
          render();
        }
      };

      window.openDoubtModal = function (subjectName, moduleTitle) {
        activeDoubtModule = { subjectName, moduleTitle };
        render();
      };

      window.closeDoubtModal = function () {
        activeDoubtModule = null;
        render();
      };

      window.submitDoubt = function () {
        const input = document.getElementById("doubtInput").value;
        if (!input.trim()) return alert("Please enter your question.");

        const outBox = document.getElementById("doubtOutput");
        const bulletsList = document.getElementById("doubtResponseBullets");

        bulletsList.innerHTML = `
        <li><strong>Core Concept:</strong> ${input.substring(0, 32)}... is governed by syllabus criteria in ${activeDoubtModule.moduleTitle}.</li>
        <li><strong>Key Rule:</strong> Ensure key constraints and boundary cases are clearly defined.</li>
        <li><strong>Exam Tip:</strong> Sketch the clean architecture or state chart to earn full marks in Part B.</li>
      `;
        outBox.classList.remove("hidden");
      };

      window.toggleSettings = function (open) {
        isSettingsOpen = open;
        render();
      };

      window.setTheme = function (darkMode) {
        isDarkMode = darkMode;
        render();
      };

      window.logout = function () {
        currentUser = null;
        authError = "";
        isSettingsOpen = false;
        activeTab = "desk";
        render();
      };

      window.openQuiz = function (title, questions) {
        activeQuizData = { title, questions };
        quizAnswers = {};
        quizSubmitted = false;
        render();
      };

      window.closeQuiz = function () {
        activeQuizData = null;
        render();
      };

      window.selectQuizAnswer = function (qIdx, optIdx) {
        quizAnswers[qIdx] = optIdx;
        render();
      };

      window.submitQuiz = function () {
        quizSubmitted = true;
        render();
      };

      render();
    </script>
  </body>
</html>
